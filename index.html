<!DOCTYPE html>
<html>
<head>
<title>NWS Weather App</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<style>

body {
    margin:0;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:white;
    background:linear-gradient(#4facfe,#00f2fe);
}

.app {
    max-width:430px;
    margin:auto;
    padding:25px;
}

h1 {
    font-size:38px;
}

.card {
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(20px);
    border-radius:25px;
    padding:20px;
    margin-top:20px;
}


.material-symbols-outlined {
    font-size:60px;
    font-variation-settings:
    'FILL' 1,
    'wght' 400,
    'GRAD' 0,
    'opsz' 48;
}


.current {
    text-align:center;
    margin:30px;
}

.temp {
    font-size:90px;
    font-weight:200;
}


.alert {
    background:rgba(255,80,80,.4);
}


.forecast-day {
    padding:15px 0;
    border-bottom:1px solid rgba(255,255,255,.2);
    cursor:pointer;
}


.row {
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.details {
    display:none;
    padding-top:15px;
    opacity:.9;
}


button {
    width:100%;
    margin-top:20px;
    padding:15px;
    border-radius:25px;
    border:0;
}


</style>
</head>


<body>


<div class="app">


<h1 id="city">Loading...</h1>


<div id="alerts"></div>


<div class="card current">

<span id="currentIcon" class="material-symbols-outlined">
cloud
</span>

<div class="temp" id="temp">
--
</div>

<div id="condition">
Loading...
</div>

</div>



<div class="card">

<h3>7-Day Forecast</h3>

<div id="forecast"></div>

</div>


<button onclick="loadWeather()">
Refresh
</button>


</div>




<script>


function icon(condition){

condition=condition.toLowerCase();


if(condition.includes("thunder"))
return "thunderstorm";

if(condition.includes("snow"))
return "weather_snowy";

if(condition.includes("rain"))
return "rainy";

if(condition.includes("fog"))
return "foggy";

if(condition.includes("cloud"))
return "cloud";

if(condition.includes("sun") || condition.includes("clear"))
return "clear_day";


return "cloud";

}




function toggle(id){

let box=document.getElementById(id);

box.style.display =
box.style.display==="block"
?"none"
:"block";

}




async function loadWeather(){


navigator.geolocation.getCurrentPosition(async pos=>{


let lat=pos.coords.latitude;
let lon=pos.coords.longitude;



let point=
await fetch(
`https://api.weather.gov/points/${lat},${lon}`
);


let pointData=
await point.json();



let location=
pointData.properties.relativeLocation.properties;


document.getElementById("city").innerHTML=
location.city;



// ALERTS

let alerts=
await fetch(
`https://api.weather.gov/alerts/active?point=${lat},${lon}`
);


let alertData=
await alerts.json();


let alertBox=
document.getElementById("alerts");


alertBox.innerHTML="";


if(alertData.features.length>0){

alertBox.innerHTML=
`
<div class="card alert">
<b>⚠ Weather Advisory</b>
<br>
${alertData.features[0].properties.headline}
</div>
`;

}




// FORECAST

let forecastURL=
pointData.properties.forecast;



let response=
await fetch(forecastURL);



let data=
await response.json();



let periods=
data.properties.periods;



let current=
periods[0];


document.getElementById("temp").innerHTML=
current.temperature+"°";


document.getElementById("condition").innerHTML=
current.shortForecast;


document.getElementById("currentIcon").innerHTML=
icon(current.shortForecast);




let days=[];



for(let i=0;i<periods.length;i++){


let p=periods[i];


if(!p.isDaytime)
continue;


let night=
periods.find(
n=>n.name===p.name+" Night"
);



days.push({

name:p.name,

icon:icon(p.shortForecast),

high:p.temperature,

low:night ? night.temperature : "--",

day:p.shortForecast,

night:night ? night.shortForecast : "No data"

});


}




let box=
document.getElementById("forecast");


box.innerHTML="";



days.slice(0,7).forEach((day,index)=>{


box.innerHTML+=`

<div class="forecast-day"
onclick="toggle('details${index}')">


<div class="row">

<span>
${day.name}
</span>


<span class="material-symbols-outlined">
${day.icon}
</span>


<span>
${day.high}° / ${day.low}°
</span>

</div>


<div class="details" id="details${index}">

<b>Day:</b>
${day.day}

<br><br>

<b>Night:</b>
${day.night}

</div>


</div>

`;

});



});


}


loadWeather();


</script>


</body>
</html>
