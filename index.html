<!DOCTYPE html>
<html>
<head>
<title>NWS Weather</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<style>

body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: white;
    background: linear-gradient(#4facfe, #00f2fe);
}

.app {
    max-width: 430px;
    margin: auto;
    padding: 25px;
}

.location {
    font-size: 38px;
    font-weight: 600;
}

.date {
    opacity: .8;
}

.current {
    text-align: center;
    margin: 35px 0;
}

.material-symbols-outlined {
    font-size: 90px;

    font-variation-settings:
    'FILL' 1,
    'wght' 400,
    'GRAD' 0,
    'opsz' 48;
}

.temp {
    font-size: 90px;
    font-weight: 200;
}

.condition {
    font-size: 28px;
}

.card {
    background: rgba(255,255,255,.18);
    backdrop-filter: blur(20px);
    border-radius: 25px;
    padding: 20px;
    margin-top: 20px;
}

.title {
    opacity: .8;
    font-size: 14px;
    margin-bottom: 15px;
}

.hourly {
    display: flex;
    gap: 25px;
    overflow-x: auto;
}

.hour {
    text-align: center;
    min-width: 60px;
}

.hour .material-symbols-outlined {
    font-size: 35px;
}

.day {
    display: flex;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,.2);
}

button {
    margin-top: 20px;
    width: 100%;
    padding: 15px;
    border-radius: 25px;
    border: none;
    background: rgba(255,255,255,.25);
    color:white;
    font-size:16px;
}

</style>

</head>

<body>

<div class="app">

<h1 id="location">
Loading...
</h1>

<div class="date" id="date"></div>


<div class="current">

<span class="material-symbols-outlined" id="icon">
cloud
</span>

<div class="temp" id="temperature">
--
</div>

<div class="condition" id="condition">
Loading weather...
</div>

</div>


<div class="card">

<div class="title">
HOURLY FORECAST
</div>

<div class="hourly" id="hourly"></div>

</div>


<div class="card">

<div class="title">
FORECAST
</div>

<div id="forecast"></div>

</div>


<button onclick="loadWeather()">
Refresh
</button>


</div>


<script>

function getIcon(condition) {

    condition = condition.toLowerCase();

    if (condition.includes("thunder"))
        return "thunderstorm";

    if (condition.includes("snow"))
        return "weather_snowy";

    if (condition.includes("rain"))
        return "rainy";

    if (condition.includes("fog"))
        return "foggy";

    if (condition.includes("cloud"))
        return "cloud";

    if (condition.includes("sun") || condition.includes("clear"))
        return "clear_day";

    return "cloud";
}



async function loadWeather() {

    navigator.geolocation.getCurrentPosition(async position => {

        let lat = position.coords.latitude;
        let lon = position.coords.longitude;


        let pointResponse = await fetch(
            `https://api.weather.gov/points/${lat},${lon}`
        );


        let pointData = await pointResponse.json();


        let city =
        pointData.properties.relativeLocation.properties.city;


        let forecastURL =
        pointData.properties.forecast;


        let forecastResponse =
        await fetch(forecastURL);


        let forecastData =
        await forecastResponse.json();


        let periods =
        forecastData.properties.periods;


        let current =
        periods[0];


        document.getElementById("location").innerHTML =
        city;


        document.getElementById("date").innerHTML =
        new Date().toDateString();


        document.getElementById("temperature").innerHTML =
        current.temperature + "°";


        document.getElementById("condition").innerHTML =
        current.shortForecast;


        document.getElementById("icon").innerHTML =
        getIcon(current.shortForecast);



        let hourlyBox =
        document.getElementById("hourly");

        hourlyBox.innerHTML = "";


        periods.slice(0,6).forEach(period => {

            hourlyBox.innerHTML += `

            <div class="hour">

            ${period.name}

            <span class="material-symbols-outlined">
            ${getIcon(period.shortForecast)}
            </span>

            ${period.temperature}°

            </div>

            `;

        });



        let forecastBox =
        document.getElementById("forecast");

        forecastBox.innerHTML = "";


        periods.slice(0,10).forEach(period => {

            forecastBox.innerHTML += `

            <div class="day">

            <span>${period.name}</span>

            <span>
            ${period.temperature}°
            </span>

            </div>

            `;

        });


    });

}


loadWeather();

</script>


</body>
</html>
